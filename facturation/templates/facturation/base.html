<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion de facturation</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Gestion Facturation</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'liste_clients' %}">Clients</a>
                <a class="nav-link" href="{% url 'liste_produits' %}">Produits</a>
                <a class="nav-link" href="{% url 'liste_factures' %}">Factures</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
